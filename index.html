<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rostros con Propósito | Maquillaje Artístico</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff007a; /* Rosa Eléctrico */
            --secondary: #00f2ff; /* Cian Neón */
            --bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- Navegación --- */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: bold; color: var(--primary); }

        nav ul { display: flex; list-style: none; gap: 30px; }

        nav a { text-decoration: none; color: #ccc; font-size: 0.9rem; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }

        nav a:hover { color: var(--secondary); }

        /* --- Secciones Generales --- */
        section { min-height: 100vh; padding: 100px 10% 60px; display: flex; flex-direction: column; justify-content: center; }

        h2 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 30px; border-left: 5px solid var(--primary); padding-left: 20px; }

        /* --- Hero / Artista --- */
        #inicio {
            background: linear-gradient(to right, rgba(10,10,10,0.9), transparent), url('https://images.unsplash.com/photo-1522338242992-e1a54906a8da?auto=format&fit=crop&q=80') no-repeat center/cover;
        }

        .hero-content { max-width: 600px; }
        .hero-content p { font-size: 1.1rem; line-height: 1.8; color: #bbb; margin-bottom: 25px; }

        /* --- Banner de Videos --- */
        #galeria { background: #111; }
        .video-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 20px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .video-card {
            min-width: 300px;
            height: 450px;
            background: #222;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .video-card:hover { transform: translateY(-10px); border-color: var(--secondary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }

        .video-card .play-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: rgba(255,255,255,0.7);
        }

        /* --- Talleres --- */
        .talleres-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .taller-item {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .taller-item:hover { background: rgba(255,255,255,0.1); }

        .taller-img { width: 100%; height: 200px; background: #333; border-radius: 10px; margin-bottom: 20px; object-fit: cover; }

        /* --- Formulario --- */
        #inscripcion { background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 100%); }

        .form-box {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(0,0,0,0.5);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--primary);
        }

        .input-group { margin-bottom: 20px; text-align: left; }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            outline: none;
        }

        input:focus { border-color: var(--secondary); }

        .btn-submit {
            background: linear-gradient(45deg, var(--primary), #ff4d00);
            color: white;
            padding: 15px 40px;
            border: none;
